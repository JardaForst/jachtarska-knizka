# Zkušební verze na GitHub Pages: po každém pushi do main sestaví aplikaci (node build.mjs),
# otestuje export a obrazovky a teprve když vše projde, nasadí dist/jachtarska-knizka.
name: Zkušební verze (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node build.mjs
      - run: node tools/test-export.mjs
      - name: Test obrazovek
        run: node tools/test-ui.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/jachtarska-knizka

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
